name: Daily India Stock Rebound Scan
on:
  schedule:
    - cron: '15 22 * * 1-5'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Trading session YYYY-MM-DD (blank uses today in India)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: indian-rebound-eod
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt 'pyarrow>=17,<24'
      - name: Run tests
        run: python -m pytest -q
      - name: Prepare adjusted EOD price histories
        env:
          AS_OF: ${{ inputs.as_of }}
        run: |
          args=()
          if [[ -n "$AS_OF" ]]; then args+=(--as-of "$AS_OF"); fi
          python -m src.prepare_eod "${args[@]}"
      - name: Scan the requested Indian trading session
        env:
          AS_OF: ${{ inputs.as_of }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          args=(--source csv)
          if [[ -n "$AS_OF" ]]; then args+=(--as-of "$AS_OF"); fi
          if [[ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]]; then
            export SHEETS_ENABLED=true
          else
            echo "::notice::Sheets publishing is pending a service account. CSV results will be saved."
            args+=(--no-sheets)
          fi
          python -m src.cli "${args[@]}"
      - name: Save scanner results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-output-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
