name: Daily India Stock Rebound Scan
on:
  schedule:
    - cron: '45 16 * * 1-5' # 22:15 IST; UTC schedule
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Trading session YYYY-MM-DD (blank uses latest weekday after close)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: indian-rebound-eod
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt 'pyarrow>=17,<24'
      - name: Run tests
        run: python -m pytest -q
      - name: Restore validated constituent cache
        uses: actions/cache/restore@v5
        with:
          path: data/cache/nifty500_snapshot.json
          key: nifty500-validated-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nifty500-validated-v1-
      - name: Resolve scan date
        env:
          REQUESTED_DATE: ${{ inputs.as_of }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, date, timedelta
          from zoneinfo import ZoneInfo
          raw = os.environ.get('REQUESTED_DATE','').strip()
          now = datetime.now(ZoneInfo('Asia/Kolkata'))
          if raw:
              target = date.fromisoformat(raw.replace('/','-'))
          else:
              target = now.date()
              if now.hour < 16:
                  target -= timedelta(days=1)
              while target.weekday() >= 5:
                  target -= timedelta(days=1)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'SCAN_DATE={target.isoformat()}\n')
          print(f'Target trading session: {target}')
          PY
      - name: Prepare adjusted EOD price histories
        env:
          AS_OF: ${{ inputs.as_of }}
          NIFTY500_CSV_URL: ${{ secrets.NIFTY500_CSV_URL }}
          NIFTY500_CSV_AS_OF: ${{ vars.NIFTY500_CSV_AS_OF }}
          NIFTY500_LOCAL_AS_OF: ${{ vars.NIFTY500_LOCAL_AS_OF }}
        run: |
          args=()
          args+=(--as-of "$SCAN_DATE")
          python -m src.prepare_eod "${args[@]}"
      - name: Save validated constituent cache
        if: always() && hashFiles('data/cache/nifty500_snapshot.json') != ''
        uses: actions/cache/save@v5
        with:
          path: data/cache/nifty500_snapshot.json
          key: nifty500-validated-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Scan the requested Indian trading session
        env:
          AS_OF: ${{ inputs.as_of }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          args=(--source csv)
          args+=(--as-of "$SCAN_DATE")
          if [[ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]]; then
            export SHEETS_ENABLED=true
          else
            echo "::notice::Sheets publishing is pending a service account. CSV results will be saved."
            args+=(--no-sheets)
          fi
          python -m src.cli "${args[@]}"
      - name: Save scanner results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scanner-output-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
